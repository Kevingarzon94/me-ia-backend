name: Deploy Node.js Backend to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare deploy package
        run: |
          mkdir deploy
          
          cp -r dist deploy/
          cp package.json deploy/
          cp pnpm-lock.yaml deploy/
          cp ecosystem.config.js deploy/

      - name: Deploy files via rsync
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 #v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='.env' --exclude='*.log'"
          SOURCE: "deploy/"
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          REMOTE_PORT: ${{ secrets.VPS_PORT }}
          TARGET: "/var/www/me-ia-backend"

      - name: Setup App and Restart PM2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 #v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: ENV_PRODUCTION
          script: |
            cd /var/www/me-ia-backend
            
            printf '%s\n' "$ENV_PRODUCTION" > .env
            
            pnpm install --prod --frozen-lockfile
            
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            
            pm2 save
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}